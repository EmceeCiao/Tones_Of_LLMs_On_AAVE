<p><strong>Response A:</strong></p><div style="width:100%; max-width:100%; overflow-wrap:anywhere; word-break:break-word;"><p style="margin:0 0 12px 0;">The project that put the first Americans into space was <strong>Project Mercury</strong>. It was NASA's first human spaceflight program, running from 1958 to 1963. The first American astronaut to travel into space was <strong>Alan Shepard</strong>, who launched aboard the <strong>Freedom 7</strong> spacecraft on May 5, 1961.</p></div>
